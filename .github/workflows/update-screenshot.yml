name: Update README Screenshot

on:
  # Re-capture weekly on Monday morning so the screenshot stays fresh even
  # when login-page changes slip through without touching tracked paths.
  schedule:
    - cron: '0 6 * * 1'

  # Re-capture whenever login-page source files change on main.
  push:
    branches: [main]
    paths:
      - 'artifacts/hrms/src/pages/login.tsx'
      - 'artifacts/hrms/src/components/brand/Logo.tsx'
      - 'artifacts/hrms/src/index.css'
      - 'artifacts/hrms/src/App.tsx'
      - 'artifacts/hrms/src/hooks/use-language.tsx'

  # Allow one-off manual runs from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  capture:
    name: Capture login screenshot
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the updated screenshot back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Install screenshot suite dependencies first — this pins @playwright/test
      # to 1.44.0 so the subsequent browser install uses the exact matching
      # Chromium revision (not whatever the latest `npx playwright` would fetch).
      - name: Install screenshot suite dependencies
        run: npm install --no-audit --prefer-offline
        working-directory: scripts/screenshot

      # Install Chromium via the *locally-pinned* Playwright CLI so the browser
      # revision matches the @playwright/test 1.44.0 that was just installed.
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium --with-deps
        working-directory: scripts/screenshot

      # The login form renders its full UI without any API call when there is
      # no session in localStorage, so we only need the frontend — no database
      # or API server is required.
      # REPL_ID is intentionally absent: GitHub Actions does not set it, so the
      # vite config's `process.env.REPL_ID !== undefined` guard stays false and
      # the Replit-specific vite plugins are skipped.
      - name: Start HRMS frontend
        env:
          PORT: '4173'
          BASE_PATH: '/'
        run: |
          pnpm --filter @workspace/hrms run dev &
          echo "HRMS_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for http://localhost:4173/login …"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/login -o /dev/null; then
              echo "Frontend is up."
              exit 0
            fi
            echo "  attempt $i/30 – not ready yet, sleeping 2s…"
            sleep 2
          done
          echo "ERROR: Frontend did not become ready within 60 s." >&2
          exit 1

      - name: Capture login screenshot
        # Use the locally-pinned Playwright binary so it matches the installed
        # Chromium revision.
        run: ./node_modules/.bin/playwright test
        working-directory: scripts/screenshot
        env:
          SCREENSHOT_BASE_URL: 'http://localhost:4173'

      - name: Stop frontend
        if: always()
        run: kill "$HRMS_PID" 2>/dev/null || true

      - name: Check for screenshot changes
        id: diff
        run: |
          git diff --quiet screenshots/login.jpg \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push updated screenshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/login.jpg
          git commit -m "chore: refresh login screenshot [skip ci]"
          git push
