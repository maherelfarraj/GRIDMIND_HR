name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Regression Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test
      NODE_ENV: test
      # Disable live-DB schema drift in publish-like environments; not needed here.
      # PILOT_AUTH is absent intentionally — auth stays enabled for all tests.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache compiled lib/* dist outputs so tsc --build is incremental across CI runs.
      # Keyed on lock file + all lib tsconfig/source files so the cache is invalidated
      # whenever any shared-lib source changes.
      - name: Restore lib dist cache
        uses: actions/cache@v4
        with:
          path: |
            lib/db/dist
            lib/db/*.tsbuildinfo
            lib/api-client-react/dist
            lib/api-client-react/*.tsbuildinfo
            lib/api-zod/dist
            lib/api-zod/*.tsbuildinfo
            lib/attendance-gateway/dist
            lib/attendance-gateway/*.tsbuildinfo
            lib/session-activity/dist
            lib/session-activity/*.tsbuildinfo
          key: lib-dist-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'lib/**/tsconfig*.json', 'lib/**/src/**') }}
          restore-keys: |
            lib-dist-${{ runner.os }}-

      # Cache the schema as a pg_dump SQL file keyed on schema source + drizzle config.
      # On a cache hit we restore the dump directly into the fresh Postgres service,
      # skipping the slow drizzle push entirely.
      # On a cache miss we run push-force then dump the result so the next run can use it.
      - name: Restore schema dump cache
        id: schema-cache
        uses: actions/cache@v4
        with:
          path: .ci-schema-dump.sql
          key: schema-dump-${{ runner.os }}-${{ hashFiles('lib/db/src/schema/**', 'lib/db/drizzle.config.ts', '**/pnpm-lock.yaml') }}

      - name: Initialize database from cache
        if: steps.schema-cache.outputs.cache-hit == 'true'
        run: psql "$DATABASE_URL" < .ci-schema-dump.sql

      - name: Push database schema and save dump
        if: steps.schema-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @workspace/db run push-force
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" > .ci-schema-dump.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test

      - name: Run regression suite
        run: bash scripts/regression.sh

  mobile-tests:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore lib dist cache
        uses: actions/cache@v4
        with:
          path: |
            lib/api-client-react/dist
            lib/api-client-react/*.tsbuildinfo
            lib/api-zod/dist
            lib/api-zod/*.tsbuildinfo
          key: lib-dist-mobile-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'lib/api-client-react/**', 'lib/api-zod/**') }}
          restore-keys: |
            lib-dist-mobile-${{ runner.os }}-

      - name: Run mobile unit tests
        run: pnpm --filter @workspace/mobile test
