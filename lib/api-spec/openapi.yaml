      summary: Get the authenticated user's notification preferences (null if none saved yet)
      parameters:
        - { name: userId, in: query, schema: { type: number }, description: 'Optional; must match the session user' }
      responses:
        '200':
          description: OK (null when the user has no saved preferences row)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/NotificationPreference' }
                  - { type: 'null' }

  /notification-preferences/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: number } }
    put:
      operationId: upsertNotificationPreferences
      tags: [Notifications]
      summary: Upsert notification preferences for user (userId must be the session user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferenceInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreference' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreference' }

