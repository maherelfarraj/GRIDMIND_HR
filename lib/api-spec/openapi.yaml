        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollPeriod" }

  # ── Payroll Runs ──────────────────────────────────────────────────────────
  /payroll-runs:
    get:
      tags: [payroll]
      summary: List payroll runs
      operationId: listPayrollRuns
      parameters:
        - name: periodId
          in: query
          schema: { type: number }
        - name: employeeId
          in: query
          schema: { type: number }
        - name: status
          in: query
          schema: { type: string }
        - name: hasException
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayrollRunSummary" }

  /payroll-runs/{id}:
    get:
      tags: [payroll]
      summary: Get payroll run detail with line items
      operationId: getPayrollRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRunDetail" }
    patch:
      tags: [payroll]
      summary: Update exception note on a payroll run
      operationId: updatePayrollRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollRunPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRunDetail" }

  /payroll-runs/{id}/payslip:
    get:
      tags: [payroll]
      summary: Get payslip view for a run
      operationId: getPayslip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payslip" }

