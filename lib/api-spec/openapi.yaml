  # ─── Organizations (multi-org admin) ─────────────────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations with branding
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Organization"
                    - type: object
                      properties:
                        branding:
                          oneOf:
                            - $ref: "#/components/schemas/OrganizationBranding"
                            - type: "null"
                      required: [branding]
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nameEn: { type: string }
                nameAr: { type: string }
                orgCode: { type: string }
                orgType: { type: ["string", "null"] }
                registrationNumber: { type: ["string", "null"] }
                countryCode: { type: ["string", "null"] }
                primaryContactEmail: { type: ["string", "null"] }
              required: [nameEn, nameAr, orgCode]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization detail with branding, locale and stats
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Organization"
                  - type: object
                    properties:
                      branding:
                        oneOf:
                          - $ref: "#/components/schemas/OrganizationBranding"
                          - type: "null"
                      locale:
                        oneOf:
                          - $ref: "#/components/schemas/PolicyLocale"
                          - type: "null"
                      stats:
                        type: object
                        properties:
                          employeeCount: { type: integer }
                        required: [employeeCount]
                    required: [branding, locale, stats]
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nameEn: { type: ["string", "null"] }
                nameAr: { type: ["string", "null"] }
                orgType: { type: ["string", "null"] }
                registrationNumber: { type: ["string", "null"] }
                countryCode: { type: ["string", "null"] }
                primaryContactEmail: { type: ["string", "null"] }
                status: { type: ["string", "null"] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    delete:
      operationId: archiveOrganization
      tags: [organizations]
      summary: Archive (soft-delete) an organization
      responses:
        "200":
          description: Archived organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

