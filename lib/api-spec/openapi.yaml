          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchServer' }
    patch:
      operationId: updateBranchServer
      tags: [admin]
      summary: Update a branch server registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchServerInput' }
      responses:
        '200':
          description: Updated server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchServer' }

  # ── Admin — Sync Queue ─────────────────────────────────────────────────────
  /admin/sync-queue:
    get:
      operationId: listSyncQueue
      tags: [admin]
      summary: List sync queue entries
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: targetServerCode, in: query, schema: { type: string } }
      responses:
        '200':
          description: Sync queue entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SyncQueueEntry' } }

  /admin/sync-queue/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    post:
      operationId: resolveSyncConflict
      tags: [admin]
      summary: Resolve a sync conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Resolved entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncQueueEntry' }

  /admin/sync-status:
    get:
      operationId: getSyncStatus
      tags: [admin]
      summary: Get overall HQ-to-branch sync status summary
      responses:
        '200':
          description: Sync status summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatusSummary' }

  # ── Admin — License ────────────────────────────────────────────────────────
  /admin/license:
    get:
      operationId: getLicense
      tags: [admin]
      summary: Get current license record
      responses:
        '200':
          description: License record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseRecord' }
    post:
      operationId: activateLicense
      tags: [admin]
      summary: Activate or update the license
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenseActivationInput' }
      responses:
        '200':
          description: Activated license
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseRecord' }

  # ── Admin — DR Status ──────────────────────────────────────────────────────
  /admin/dr-status:
    get:
      operationId: getDrStatus
      tags: [admin]
      summary: Get disaster-recovery readiness status
      responses:
        '200':
          description: DR status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrStatus' }


