  # ─── Config Packages ─────────────────────────────────────────
  /config-packages:
    get:
      operationId: listConfigPackages
      tags: [configPackages]
      summary: List config packages
      parameters:
        - in: query
          name: status
          schema: { type: ["string", "null"] }
        - in: query
          name: packageType
          schema: { type: ["string", "null"] }
      responses:
        "200":
          description: Config packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigPackage"
    post:
      operationId: createConfigPackage
      tags: [configPackages]
      summary: Create a config package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packageName: { type: string }
                packageType: { type: string }
                version: { type: string }
                sourceEnvironment: { type: string }
                targetEnvironment: { type: string }
                descriptionEn: { type: ["string", "null"] }
                payloadJson: { type: ["string", "null"] }
                policyAreasJson: { type: ["string", "null"] }
              required: [packageName, packageType, version, sourceEnvironment, targetEnvironment]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPackage"

  /config-packages/import:
    post:
      operationId: importConfigPackage
      tags: [configPackages]
      summary: Import a signed config package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packageJson: {}
              required: [packageJson]
      responses:
        "201":
          description: Imported package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPackage"
        "400":
          description: Signature verification failed or invalid payload

  /config-packages/{id}:
    get:
      operationId: getConfigPackage
      tags: [configPackages]
      summary: Get a config package with items
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Config package
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ConfigPackage"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ConfigPackageItem"
                    required: [items]
        "404":
          description: Not found

  /config-packages/{id}/sign:
    post:
      operationId: signConfigPackage
      tags: [configPackages]
      summary: Sign a config package
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Signed package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPackage"

  /config-packages/{id}/export:
    post:
      operationId: exportConfigPackage
      tags: [configPackages]
      summary: Export a config package with items
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Exported package
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ConfigPackage"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ConfigPackageItem"
                    required: [items]

  /config-packages/{id}/apply:
    post:
      operationId: applyConfigPackage
      tags: [configPackages]
      summary: Apply an imported config package
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: ["string", "null"] }
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                type: object
                properties:
                  package:
                    $ref: "#/components/schemas/ConfigPackage"
                  itemsApplied: { type: integer }
                required: [package, itemsApplied]

  /config-packages/{id}/reject:
    post:
      operationId: rejectConfigPackage
      tags: [configPackages]
      summary: Reject a config package
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: ["string", "null"] }
      responses:
        "200":
          description: Rejected package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPackage"

  /config-packages/{id}/preview-impact:
    get:
      operationId: previewConfigPackageImpact
      tags: [configPackages]
      summary: Preview the impact of applying a config package
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Impact preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  packageId: { type: integer }
                  packageName: { type: string }
                  itemCount: { type: integer }
                  policyAreas:
                    type: array
                    items: { type: string }
                  affectedEntityTypes:
                    type: array
                    items: { type: string }
                  warnings:
                    type: array
                    items: { type: string }
                  estimatedApplyTimeSeconds: { type: integer }
                required: [packageId, packageName, itemCount, policyAreas, affectedEntityTypes, warnings, estimatedApplyTimeSeconds]

  # ─── Environment Snapshots ───────────────────────────────────
  /environment-snapshots:
    get:
      operationId: listEnvironmentSnapshots
      tags: [configPackages]
      summary: List environment snapshots
      parameters:
        - in: query
          name: environment
          schema: { type: ["string", "null"] }
        - in: query
          name: orgId
          schema: { type: ["integer", "null"] }
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvironmentSnapshot"
    post:
      operationId: createEnvironmentSnapshot
      tags: [configPackages]
      summary: Capture an environment snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshotName: { type: string }
                environment: { type: string }
                scope: { type: string }
                snapshotJson: { type: ["string", "null"] }
                notes: { type: ["string", "null"] }
              required: [snapshotName, environment, scope]
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentSnapshot"

  /environment-snapshots/compare:
    post:
      operationId: compareEnvironmentSnapshots
      tags: [configPackages]
      summary: Compare two environment snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshotIdA: { type: integer }
                snapshotIdB: { type: integer }
              required: [snapshotIdA, snapshotIdB]
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshotA:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      capturedAt: { type: string }
                    required: [id, name, capturedAt]
                  snapshotB:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      capturedAt: { type: string }
                    required: [id, name, capturedAt]
                  diffCount: { type: integer }
                  diffs:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        snapshotA: {}
                        snapshotB: {}
                      required: [field]
                required: [snapshotA, snapshotB, diffCount, diffs]

  /environment-snapshots/{id}:
    get:
      operationId: getEnvironmentSnapshot
      tags: [configPackages]
      summary: Get an environment snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentSnapshot"

  /environment-snapshots/{id}/pin:
    post:
      operationId: pinEnvironmentSnapshot
      tags: [configPackages]
      summary: Pin an environment snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Pinned snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentSnapshot"

  # ─── Data Import ─────────────────────────────────────────────
  /imports:
    get:
      operationId: listImportJobs
      tags: [dataImport]
      summary: List data import jobs
      parameters:
        - in: query
          name: type
          schema: { type: ["string", "null"] }
      responses:
        "200":
          description: Import jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataImportJob"
    post:
      operationId: createImportJob
      tags: [dataImport]
      summary: Create an import job and validate its rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                importType: { type: string }
                fileFormat: { type: ["string", "null"] }
                originalFilename: { type: ["string", "null"] }
                rowsJson:
                  type: array
                  items: {}
                columnMappingJson: {}
              required: [importType, rowsJson]
      responses:
        "201":
          description: Created job with validated rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataImportJob"
                  - type: object
                    properties:
                      validatedRows:
                        type: array
                        items:
                          type: object
                          properties:
                            rowNumber: { type: integer }
                            status: { type: string }
                            rawDataJson: { type: ["string", "null"] }
                            mappedDataJson: { type: ["string", "null"] }
                            errorsJson: { type: ["string", "null"] }
                            isDuplicate: { type: boolean }
                          required: [rowNumber, status, isDuplicate]
                    required: [validatedRows]

  /imports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: number } }
    get:
      operationId: getImportJob
      tags: [dataImport]
      summary: Get an import job with row stats
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataImportJob"
                  - type: object
                    properties:
                      rowStats:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { type: string }
                            count: { type: integer }
                          required: [status, count]
                    required: [rowStats]
        "404":
          description: Not found
    delete:
      operationId: deleteImportJob
      tags: [dataImport]
      summary: Delete an import job and its rows
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                required: [deleted]

  /imports/{id}/rows:
    get:
      operationId: listImportJobRows
      tags: [dataImport]
      summary: List rows of an import job (paginated)
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
        - in: query
          name: status
          schema: { type: ["string", "null"] }
        - in: query
          name: page
          schema: { type: ["integer", "null"] }
        - in: query
          name: pageSize
          schema: { type: ["integer", "null"] }
      responses:
        "200":
          description: Paginated rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataImportRow"
                required: [page, pageSize, total, rows]

  /imports/{id}/confirm-preview:
    post:
      operationId: confirmImportPreview
      tags: [dataImport]
      summary: Confirm the validation preview of an import job
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataImportJob"

  /imports/{id}/execute:
    post:
      operationId: executeImportJob
      tags: [dataImport]
      summary: Execute a confirmed import job
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Executed job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataImportJob"
                  - type: object
                    properties:
                      imported: { type: integer }
                    required: [imported]

  /imports/{id}/rollback:
    post:
      operationId: rollbackImportJob
      tags: [dataImport]
      summary: Roll back an executed import job
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Rolled-back job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataImportJob"
                  - type: object
                    properties:
                      rolledBack: { type: integer }
                    required: [rolledBack]

  /import-mapping-templates:
    get:
      operationId: listImportMappingTemplates
      tags: [dataImport]
      summary: List import mapping templates
      parameters:
        - in: query
          name: type
          schema: { type: ["string", "null"] }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportMappingTemplate"
    post:
      operationId: createImportMappingTemplate
      tags: [dataImport]
      summary: Save an import mapping template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                importType: { type: string }
                columnMappingJson: {}
                isDefault: { type: ["boolean", "null"] }
              required: [name, importType, columnMappingJson]
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMappingTemplate"

  /import-mapping-templates/{id}:
    delete:
      operationId: deleteImportMappingTemplate
      tags: [dataImport]
      summary: Delete an import mapping template
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                required: [deleted]

components:
  schemas:
    # ── Attendance Gateway (device integration) ────────────────────────────
    GatewayRegistration:
      type: object
      description: >
        A registered local Attendance Gateway (secretHash is intentionally
        never exposed through the API).
      properties:
        id: { type: number }
        name: { type: string }
        nameAr: { type: ["string", "null"] }
        deviceId: { type: ["number", "null"] }
        adapterType: { type: string, enum: [ZKTECO, SUPREMA, GENERIC_REST, CSV, SIMULATOR] }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        registeredByUserId: { type: number }
        lastSeenAt: { type: ["string", "null"] }
        lastHeartbeatAt: { type: ["string", "null"] }
        clockDriftMs: { type: ["number", "null"] }
        driftAlert: { type: boolean }
        adapterConnStatus:
          type: ["string", "null"]
          enum: [REACHABLE, AUTH_FAILED, UNREACHABLE, NOT_CONFIGURED, null]
        adapterConnMessage: { type: ["string", "null"] }
        adapterConnTestedAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    PunchImportBatch:
      type: object
      properties:
        id: { type: number }
        batchUuid: { type: string }
        registrationId: { type: ["number", "null"] }
        source: { type: string, enum: [GATEWAY, CSV, SIMULATOR] }
        receivedAt: { type: string }
        eventCount: { type: number }
        insertedCount: { type: number }
        duplicateCount: { type: number }
        errorCount: { type: number }
        unmappedCount: { type: number }
        rawPayloadSha256: { type: ["string", "null"] }
        signatureValid: { type: boolean }
        clockDriftMs: { type: ["number", "null"] }
        status: { type: string, enum: [COMPLETED, PARTIAL, FAILED] }
        errorSummary: { type: ["string", "null"] }
        createdAt: { type: string }

    # ── Phase 7A — Workforce Analytics + Report Builder + Exports ──────────────
    WorkforceSnapshot:
      type: object
      properties:
        id: { type: number }
        snapshotDate: { type: string }
        period: { type: string }
        headcount: { type: number }
        newHires: { type: number }
        departures: { type: number }
        openVacancies: { type: number }
        totalPayroll: { type: string }
        avgSalary: { type: string }
        overtimeHours: { type: string }
        absenceRate: { type: string }
        createdAt: { type: string }

    PayrollVarianceLog:
      type: object
      properties:
        id: { type: number }
        periodId: { type: number }
        prevPeriodId: { type: ["number", "null"] }
        totalGross: { type: string }
        prevTotalGross: { type: ["string", "null"] }
        variance: { type: string }
        variancePct: { type: string }
        exceptionsCount: { type: number }
        createdAt: { type: string }
        periodCode: { type: string }
        periodNameEn: { type: string }
        startDate: { type: string }

    AnalyticsKpiCache:
      type: object
      properties:
        id: { type: number }
        cacheKey: { type: string }
        valueJson: { type: string }
        computedAt: { type: string }
        expiresAt: { type: string }

    ReportBuilderConfig:
      type: object
      properties:
        id: { type: number }
        nameEn: { type: string }
        nameAr: { type: string }
        descriptionEn: { type: ["string", "null"] }
        createdByUserId: { type: ["number", "null"] }
        dataSource: { type: string }
        columnsJson: { type: string }
        filtersJson: { type: ["string", "null"] }
        sortByJson: { type: ["string", "null"] }
        groupByJson: { type: ["string", "null"] }
        roleRestriction: { type: ["string", "null"] }
        isPublic: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    ExportJob:
      type: object
      properties:
        id: { type: number }
        jobType: { type: string }
        entityType: { type: string }
        entityId: { type: ["number", "null"] }
        requestedByUserId: { type: ["number", "null"] }
        status: { type: string }
        parametersJson: { type: ["string", "null"] }
        outputPath: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        createdAt: { type: string }

    ScheduledExport:
      type: object
      properties:
        id: { type: number }
        reportBuilderConfigId: { type: ["number", "null"] }
        nameEn: { type: string }
        cronExpression: { type: string }
        timezone: { type: string }
        format: { type: string }
        recipientUserIds: { type: ["string", "null"] }
        isActive: { type: boolean }
        lastRunAt: { type: ["string", "null"] }
        nextRunAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Dashboard ──────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalEmployees: { type: number }
        activeEmployees: { type: number }
        newHiresThisMonth: { type: number }
        pendingApprovals: { type: number }
        openAlerts: { type: number }
        onLeaveToday: { type: number }
        presentToday: { type: number }
        absentToday: { type: number }
        totalDepartments: { type: number }
        totalDevices: { type: number }
        onlineDevices: { type: number }
        documentsPendingReview: { type: number }
      required:
        - totalEmployees
        - activeEmployees
        - newHiresThisMonth
        - pendingApprovals
        - openAlerts
        - onLeaveToday
        - presentToday
        - absentToday
        - totalDepartments
        - totalDevices
        - onlineDevices
        - documentsPendingReview

    ExecutiveDashboard:
      type: object
      properties:
        generatedAt: { type: string }
        todayCoveragePct: { type: number }
        attendanceTrend:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              presentCount: { type: number }
              totalCount: { type: number }
              ratePct: { type: number }
            required: [date, presentCount, totalCount, ratePct]
        coverageGaps:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              shiftId: { type: number }
              shiftCode: { type: string }
              shiftNameEn: { type: string }
              shiftNameAr: { type: string }
              scheduled: { type: number }
              worked: { type: number }
              gap: { type: number }
            required: [date, shiftId, shiftCode, shiftNameEn, shiftNameAr, scheduled, worked, gap]
        otCostByDepartment:
          type: array
          items:
            type: object
            properties:
              departmentId: { type: number }
              departmentNameEn: { type: string }
              departmentNameAr: { type: string }
              otMinutes: { type: number }
              multiplier: { type: number }
              costIndex: { type: number }
            required: [departmentId, departmentNameEn, departmentNameAr, otMinutes, multiplier, costIndex]
        topLatecomers:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: number }
              nameEn: { type: string }
              nameAr: { type: string }
              totalLateMinutes: { type: number }
              occurrences: { type: number }
            required: [employeeId, nameEn, nameAr, totalLateMinutes, occurrences]
        departmentHeatmap:
          type: array
          items:
            type: object
            properties:
              departmentId: { type: number }
              departmentNameEn: { type: string }
              departmentNameAr: { type: string }
              headcount: { type: number }
              days:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string }
                    rostered: { type: number }
                    present: { type: number }
                    ratePct: { type: number }
                  required: [date, rostered, present, ratePct]
            required: [departmentId, departmentNameEn, departmentNameAr, headcount, days]
      required:
        - generatedAt
        - todayCoveragePct
        - attendanceTrend
        - coverageGaps
        - otCostByDepartment
        - topLatecomers
        - departmentHeatmap

    ActivityItem:
      type: object
      properties:
        id: { type: number }
        type: { type: string }
        description: { type: string }
        descriptionAr: { type: string }
        actorName: { type: string }
        entityType: { type: string }
        entityId: { type: number }
        createdAt: { type: string }
      required: [id, type, description, descriptionAr, actorName, entityType, entityId, createdAt]

    AttendanceOverview:
      type: object
      properties:
        date: { type: string }
        presentCount: { type: number }
        absentCount: { type: number }
        lateCount: { type: number }
        onLeaveCount: { type: number }
        byDepartment:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentAttendanceStat"
      required: [date, presentCount, absentCount, lateCount, onLeaveCount, byDepartment]

    DepartmentAttendanceStat:
      type: object
      properties:
        departmentId: { type: number }
        departmentName: { type: string }
        present: { type: number }
        absent: { type: number }
        late: { type: number }
        onLeave: { type: number }
      required: [departmentId, departmentName, present, absent, late, onLeave]

    # ── Employee ───────────────────────────────────────────
    Employee:
      type: object
      properties:
        id: { type: number }
        employeeNumber: { type: string }
        firstNameEn: { type: string }
        lastNameEn: { type: string }
        firstNameAr: { type: string }
        lastNameAr: { type: string }
        nationalId: { type: string }
        jobTitleEn: { type: string }
        jobTitleAr: { type: string }
        departmentId: { type: number }
        departmentNameEn: { type: string }
        departmentNameAr: { type: string }
        managerId: { type: ["integer", "null"] }
        managerNameEn: { type: ["string", "null"] }
        roleId: { type: number }
        roleNameEn: { type: string }
        status: { type: string }
        employmentType: { type: string }
        grade: { type: ["string", "null"] }
        rankEn: { type: ["string", "null"] }
        rankAr: { type: ["string", "null"] }
        email: { type: string }
        phone: { type: ["string", "null"] }
        hireDate: { type: string }
        contractEndDate: { type: ["string", "null"] }
        nationality: { type: string }
        photoUrl: { type: ["string", "null"] }
        organizationType: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - employeeNumber
        - firstNameEn
        - lastNameEn
        - firstNameAr
        - lastNameAr
        - nationalId
        - jobTitleEn
        - jobTitleAr
        - departmentId
        - departmentNameEn
        - departmentNameAr
        - managerId
        - managerNameEn
        - roleId
        - roleNameEn
        - status
        - employmentType
        - email
        - hireDate
        - nationality
        - organizationType
        - createdAt
        - updatedAt

    EmployeeList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        total: { type: number }
        page: { type: number }
        limit: { type: number }
      required: [data, total, page, limit]

    EmployeeInput:
      type: object
      properties:
        employeeNumber: { type: string }
        firstNameEn: { type: string }
        lastNameEn: { type: string }
        firstNameAr: { type: string }
        lastNameAr: { type: string }
        nationalId: { type: string }
        jobTitleEn: { type: string }
        jobTitleAr: { type: string }
        departmentId: { type: number }
        managerId: { type: ["integer", "null"] }
        roleId: { type: number }
        status: { type: string }
        employmentType: { type: string }
        grade: { type: ["string", "null"] }
        rankEn: { type: ["string", "null"] }
        rankAr: { type: ["string", "null"] }
        email: { type: string }
        phone: { type: ["string", "null"] }
        hireDate: { type: string }
        contractEndDate: { type: ["string", "null"] }
        nationality: { type: string }
        photoUrl: { type: ["string", "null"] }
        organizationType: { type: string }
      required:
        - employeeNumber
        - firstNameEn
        - lastNameEn
        - firstNameAr
        - lastNameAr
        - nationalId
        - jobTitleEn
        - jobTitleAr
        - departmentId
        - roleId
        - status
        - employmentType
        - email
        - hireDate
        - nationality
        - organizationType

    EmployeeUpdate:
      type: object
      properties:
        firstNameEn: { type: string }
        lastNameEn: { type: string }
        firstNameAr: { type: string }
        lastNameAr: { type: string }
        jobTitleEn: { type: string }
        jobTitleAr: { type: string }
        departmentId: { type: number }
        managerId: { type: ["integer", "null"] }
        roleId: { type: number }
        status: { type: string }
        employmentType: { type: string }
        grade: { type: ["string", "null"] }
        rankEn: { type: ["string", "null"] }
        rankAr: { type: ["string", "null"] }
        email: { type: string }
        phone: { type: ["string", "null"] }
        contractEndDate: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }

    # ── Department ─────────────────────────────────────────
    Department:
      type: object
      properties:
        id: { type: number }
        nameEn: { type: string }
        nameAr: { type: string }
        code: { type: string }
        parentId: { type: ["integer", "null"] }
        parentNameEn: { type: ["string", "null"] }
        headEmployeeId: { type: ["integer", "null"] }
        headEmployeeNameEn: { type: ["string", "null"] }
        organizationType: { type: string }
        description: { type: ["string", "null"] }
        employeeCount: { type: number }
        createdAt: { type: string }
      required: [id, nameEn, nameAr, code, parentId, headEmployeeId, organizationType, employeeCount, createdAt]

    DepartmentNode:
      type: object
      properties:
        id: { type: number }
        nameEn: { type: string }
        nameAr: { type: string }
        code: { type: string }
        parentId: { type: ["integer", "null"] }
        headEmployeeNameEn: { type: ["string", "null"] }
        employeeCount: { type: number }
        children:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentNode"
      required: [id, nameEn, nameAr, code, parentId, employeeCount, children]

    DepartmentInput:
      type: object
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        code: { type: string }
        parentId: { type: ["integer", "null"] }
        headEmployeeId: { type: ["integer", "null"] }
        organizationType: { type: string }
        description: { type: ["string", "null"] }
      required: [nameEn, nameAr, code, organizationType]

    DepartmentUpdate:
      type: object
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        code: { type: string }
        parentId: { type: ["integer", "null"] }
        headEmployeeId: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }

    # ── Role & Permissions ─────────────────────────────────
    Role:
      type: object
      properties:
        id: { type: number }
        nameEn: { type: string }
        nameAr: { type: string }
        description: { type: ["string", "null"] }
        permissions:
          type: array
          items:
            type: string
        systemRole: { type: boolean }
        userCount: { type: number }
        createdAt: { type: string }
      required: [id, nameEn, nameAr, permissions, systemRole, userCount, createdAt]

    RoleInput:
      type: object
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        description: { type: ["string", "null"] }
        permissions:
          type: array
          items:
            type: string
      required: [nameEn, nameAr, permissions]

    RoleUpdate:
      type: object
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        description: { type: ["string", "null"] }
        permissions:
          type: array
          items:
            type: string

    Permission:
      type: object
      properties:
        key: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        module: { type: string }
      required: [key, nameEn, nameAr, module]

    # ── Documents ──────────────────────────────────────────
    Document:
      type: object
      properties:
        id: { type: number }
        employeeId: { type: number }
        employeeNameEn: { type: string }
        titleEn: { type: string }
        titleAr: { type: string }
        category: { type: string }
        status: { type: string }
        fileUrl: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        fileSize: { type: ["integer", "null"] }
        mimeType: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
        issuedAt: { type: ["string", "null"] }
        uploadedByUserId: { type: number }
        uploadedByUserName: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
      required:
        - id
        - employeeId
        - employeeNameEn
        - titleEn
        - titleAr
        - category
        - status
        - uploadedByUserId
        - uploadedByUserName
        - createdAt

    DocumentInput:
      type: object
      properties:
        employeeId: { type: number }
        titleEn: { type: string }
        titleAr: { type: string }
        category: { type: string }
        status: { type: string }
        fileUrl: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        fileSize: { type: ["integer", "null"] }
        mimeType: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
        issuedAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required: [employeeId, titleEn, titleAr, category, status]

    DocumentUpdate:
      type: object
      properties:
        titleEn: { type: string }
        titleAr: { type: string }
        category: { type: string }
        status: { type: string }
        expiresAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

